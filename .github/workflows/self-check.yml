name: CI Gates Self Check

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-check:
    name: Self Check
    # Public repo + self-hosted runner: never run code from a fork's pull request on this machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, ci-scope]
    timeout-minutes: 10
    env:
      # setup-python on the self-hosted runner resolves to a uv-managed (PEP 668) Python
      PIP_BREAK_SYSTEM_PACKAGES: "1"

    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"

      - name: Checkout this revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Ruff
        run: python3 -m pip install --disable-pip-version-check ruff==0.15.22

      - name: Install coverage.py
        run: python3 -m pip install --disable-pip-version-check coverage==7.8.2

      - name: Check Python syntax
        run: python3 -m compileall -q scripts tests

      - name: Check test discovery
        run: python3 scripts/check-test-discovery.py --start-directory tests --pattern 'test_*.py'

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -q

      - name: Enforce release manifest and pinned canary refs
        run: |
          if python3 scripts/release_enforcement.py \
            tests/fixtures/release-manifest-v2.json \
            --environment production \
            --workflow tests/fixtures/production-caller.yml \
            --provenance tests/fixtures/release-provenance-unresolved.json; then
            echo "release fixture unexpectedly passed without verified external provenance"
            exit 1
          fi

      - name: Measure Python line and branch coverage
        run: |
          python3 -m coverage erase
          python3 -m coverage run --rcfile=configs/coverage.ini -m unittest discover -s tests -p 'test_*.py' -q
          python3 -m coverage report --rcfile=configs/coverage.ini

      - name: Run Code Linter from this revision
        run: python3 scripts/code-linter.py --config .code-linter.json --mode all

      - name: Run Ruff
        run: |
          ruff check --config configs/ruff-strict.toml scripts tests
          ruff format --check --config configs/ruff-strict.toml scripts tests

      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Check whitespace errors
        run: git diff --check
