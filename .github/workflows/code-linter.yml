name: Code Linter

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON array of runner labels to target.
        type: string
        default: '["self-hosted", "macOS", "ARM64", "ci-scope"]'
      runner-group:
        description: Runner group for the routing contract.
        type: string
        default: Default
      runner-labels:
        description: JSON array of runner labels to target.
        type: string
        default: '["self-hosted", "macOS", "ARM64", "ci-scope"]'
      runner-label:
        description: Single runner label used by the GitHub group-and-label scheduler.
        type: string
        default: ci-scope
      routing-generation:
        description: Routing generation; v1 remains the production default.
        type: string
        default: v1
      workflow-contract-version:
        description: Workflow contract version; v1 remains the production default.
        type: string
        default: v1
      trust-fixture-mode:
        description: Canary-only trust fixture mode; empty/off in production.
        type: string
        default: ''
      mode:
        description: "Files to scan: auto (derive from event), all, or changed."
        type: string
        default: auto
      config:
        description: Path to the Code Linter config in the calling repo.
        type: string
        default: .code-linter.json
      coverage-mode:
        description: Coverage policy override; empty uses the repository config.
        type: string
        default: ''
      gates-ref:
        description: ci-gates ref to fetch scripts from.
        type: string
        default: main
      explain-model:
        description: Ollama model that explains failures; empty string disables.
        type: string
        default: qwen3-coder:30b-a3b-q4_K_M

jobs:
  routing-validation:
    uses: ./.github/workflows/routing-validation.yml
    with:
      runner-group: ${{ inputs['runner-group'] }}
      runner-labels: ${{ inputs['runner-labels'] }}
      routing-generation: ${{ inputs['routing-generation'] }}
      workflow-contract-version: ${{ inputs['workflow-contract-version'] }}
      trust-fixture-mode: ${{ inputs['trust-fixture-mode'] }}
      gates-ref: ${{ inputs['gates-ref'] }}

  code-linter:
    name: Code Linter
    needs: routing-validation
    if: ${{ needs.routing-validation.result == 'success' }}
    runs-on:
      group: ${{ inputs['runner-group'] }}
      labels: ${{ inputs['runner-label'] }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"

      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout ci-gates
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ForkHorizon/ci-gates
          ref: ${{ inputs.gates-ref }}
          path: .ci-gates
          persist-credentials: false

      - name: Select scan mode
        id: scan
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mode="$INPUT_MODE"
          base="origin/$DEFAULT_BRANCH"
          head="HEAD"

          if [ "$mode" = "auto" ] || [ -z "$mode" ]; then
            case "$EVENT_NAME" in
              pull_request) mode=changed ;;
              merge_group)  mode=changed ;;
              *)            mode=all ;;
            esac
          fi

          case "$mode" in
            all|changed) ;;
            *) echo "Invalid scan mode: $mode" >&2; exit 2 ;;
          esac

          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$EVENT_SHA"
              ;;
            merge_group)
              base="$MERGE_BASE_SHA"
              head="$EVENT_SHA"
              ;;
          esac

          {
            echo "mode=$mode"
            echo "base=$base"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"

      - name: Run Code Linter
        shell: bash
        env:
          CONFIG_PATH: ${{ inputs.config }}
          COVERAGE_MODE: ${{ inputs['coverage-mode'] }}
          SCAN_MODE: ${{ steps.scan.outputs.mode }}
          BASE_SHA: ${{ steps.scan.outputs.base }}
          HEAD_SHA: ${{ steps.scan.outputs.head }}
        run: |
          set -euo pipefail

          if [ "$SCAN_MODE" = "changed" ]; then
            set -- --config "$CONFIG_PATH" --mode changed --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            set -- --config "$CONFIG_PATH" --mode all
          fi
          if [ -n "$COVERAGE_MODE" ]; then
            set -- "$@" --coverage-mode "$COVERAGE_MODE"
          fi
          python3 .ci-gates/scripts/code-linter.py "$@" 2>&1 | tee "$RUNNER_TEMP/ci-gate.log"

      - name: Explain failure
        if: ${{ failure() && inputs.explain-model != '' }}
        shell: bash
        env:
          EXPLAIN_MODEL: ${{ inputs.explain-model }}
          BASE_SHA: ${{ steps.scan.outputs.base }}
        run: |
          python3 .ci-gates/scripts/explain-failure.py \
            --log "$RUNNER_TEMP/ci-gate.log" \
            --gate "Code Linter" \
            --model "$EXPLAIN_MODEL" \
            --base "$BASE_SHA"
