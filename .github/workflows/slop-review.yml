name: Slop Review

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON array of runner labels to target.
        type: string
        default: '["self-hosted", "macOS", "ARM64", "ci-scope"]'
      runner-group:
        description: Runner group for the routing contract.
        type: string
        default: Default
      runner-labels:
        description: JSON array of runner labels to target.
        type: string
        default: '["self-hosted", "macOS", "ARM64", "ci-scope"]'
      routing-generation:
        description: Routing generation; v1 remains the production default.
        type: string
        default: v1
      workflow-contract-version:
        description: Workflow contract version; v1 remains the production default.
        type: string
        default: v1
      trust-fixture-mode:
        description: Canary-only trust fixture mode; empty/off in production.
        type: string
        default: ''
      config:
        description: Path to the slop-review config in the calling repo.
        type: string
        default: .slop-review.json
      gates-ref:
        description: ci-gates ref to fetch scripts from.
        type: string
        default: main
      model:
        description: Model used for review (e.g. deepseek-chat or Ollama model); empty string disables the job.
        type: string
        default: deepseek-chat

jobs:
  slop-review:
    name: Slop Review
    if: ${{ (inputs['routing-generation'] == 'v1' && inputs['workflow-contract-version'] == 'v1') || (inputs['routing-generation'] == 'v2' && inputs['workflow-contract-version'] == 'v2') }}
    runs-on:
      group: ${{ inputs['runner-group'] }}
      labels: ${{ fromJSON(inputs['runner-labels']) }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"

      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Fetch ci-gates
        shell: bash
        env:
          GATES_REF: ${{ inputs.gates-ref }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ci-gates"
          git clone --quiet --no-checkout --filter=blob:none \
            https://github.com/ForkHorizon/ci-gates "$RUNNER_TEMP/ci-gates"
          git -C "$RUNNER_TEMP/ci-gates" fetch --quiet --depth 1 origin -- "$GATES_REF"
          git -C "$RUNNER_TEMP/ci-gates" checkout --quiet --detach FETCH_HEAD

      - name: Resolve review range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
              echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "base=origin/${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
              echo "head=HEAD" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Review diff for AI slop
        if: ${{ inputs.model != '' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || env.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/ci-gates/scripts/slop-review.py" \
            --base "${{ steps.range.outputs.base }}" \
            --head "${{ steps.range.outputs.head }}" \
            --config "${{ inputs.config }}" \
            --model "${{ inputs.model }}"
