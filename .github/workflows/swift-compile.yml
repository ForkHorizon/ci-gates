name: Swift Compile Gate

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON array of runner labels to target.
        type: string
        default: '["self-hosted", "macOS", "ARM64", "ci-scope-broker"]'
      runner-group:
        description: Runner group for the routing contract.
        type: string
        default: ci-scope-broker
      runner-labels:
        description: JSON array of runner labels to target.
        type: string
        default: '["self-hosted", "macOS", "ARM64", "ci-scope-broker"]'
      routing-generation:
        description: Routing generation; v1 remains the production default.
        type: string
        default: v1
      workflow-contract-version:
        description: Workflow contract version; v1 remains the production default.
        type: string
        default: v1
      trust-fixture-mode:
        description: Canary-only trust fixture mode; empty/off in production.
        type: string
        default: ''
      config:
        description: Path to the compile gate config in the calling repo.
        type: string
        default: .swift-compile-gate.json
      gates-ref:
        description: ci-gates ref to fetch scripts from.
        type: string
        default: main
      explain-model:
        description: Ollama model that explains failures; empty string disables.
        type: string
        default: qwen3-coder:30b-a3b-q4_K_M

jobs:
  swift-compile-gate:
    name: Swift Compile Gate
    if: ${{ (inputs['routing-generation'] == 'v1' && inputs['workflow-contract-version'] == 'v1') || (inputs['routing-generation'] == 'v2' && inputs['workflow-contract-version'] == 'v2') }}
    runs-on:
      group: ${{ inputs['runner-group'] }}
      labels: ${{ fromJSON(inputs['runner-labels']) }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"

      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Checkout ci-gates
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ForkHorizon/ci-gates
          ref: ${{ inputs.gates-ref }}
          path: .ci-gates

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci-gates/scripts/swift-compile-gate.py --config "${{ inputs.config }}" 2>&1 \
            | tee "$RUNNER_TEMP/ci-gate.log"

      - name: Explain failure
        if: ${{ failure() && inputs.explain-model != '' }}
        shell: bash
        run: |
          python3 .ci-gates/scripts/explain-failure.py \
            --log "$RUNNER_TEMP/ci-gate.log" \
            --gate "Swift Compile Gate" \
            --model "${{ inputs.explain-model }}" \
            --base "origin/${{ github.event.repository.default_branch }}"
