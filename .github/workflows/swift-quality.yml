name: Swift Quality Gate

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON array of runner labels to target.
        type: string
        default: '["self-hosted", "macOS", "ARM64", "ci-scope-broker"]'
      mode:
        description: "Files to scan: auto (derive from event), all, or changed."
        type: string
        default: auto
      config:
        description: Path to the quality gate config in the calling repo.
        type: string
        default: .swift-quality-gate.json
      run-build:
        description: Run the build stage (redundant if Swift Compile Gate also runs).
        type: boolean
        default: true
      gates-ref:
        description: ci-gates ref to fetch scripts from.
        type: string
        default: main
      explain-model:
        description: Ollama model that explains failures; empty string disables.
        type: string
        default: qwen3-coder:30b-a3b-q4_K_M

jobs:
  swift-quality-gate:
    name: Swift Quality Gate
    runs-on: ${{ fromJSON(inputs['runs-on']) }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.9.6"

      - name: Checkout project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout ci-gates
        uses: actions/checkout@v6
        with:
          repository: ForkHorizon/ci-gates
          ref: ${{ inputs.gates-ref }}
          path: .ci-gates

      - name: Select scan mode
        id: scan
        shell: bash
        run: |
          set -euo pipefail

          mode="${{ inputs.mode }}"
          base="origin/${{ github.event.repository.default_branch }}"
          head="HEAD"

          if [ "$mode" = "auto" ] || [ -z "$mode" ]; then
            case "${{ github.event_name }}" in
              pull_request) mode=changed ;;
              merge_group)  mode=changed ;;
              *)            mode=all ;;
            esac
          fi

          case "${{ github.event_name }}" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.sha }}"
              ;;
            merge_group)
              base="${{ github.event.merge_group.base_sha }}"
              head="${{ github.sha }}"
              ;;
          esac

          {
            echo "mode=$mode"
            echo "base=$base"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        if: ${{ inputs.run-build }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci-gates/scripts/_progress.py --step quality --current 1 --total 3 --detail "Building"
          python3 .ci-gates/scripts/swift-quality-gate.py \
            --config "${{ inputs.config }}" \
            --stage build \
            --mode all 2>&1 | tee -a "$RUNNER_TEMP/ci-gate.log"

      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci-gates/scripts/_progress.py --step quality --current ${{ inputs.run-build && 2 || 1 }} --total ${{ inputs.run-build && 3 || 2 }} --detail "Checking format"
          python3 .ci-gates/scripts/swift-quality-gate.py \
            --config "${{ inputs.config }}" \
            --stage format \
            --mode "${{ steps.scan.outputs.mode }}" \
            --base "${{ steps.scan.outputs.base }}" \
            --head "${{ steps.scan.outputs.head }}" 2>&1 | tee -a "$RUNNER_TEMP/ci-gate.log"

      - name: DeadCodeGate
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci-gates/scripts/_progress.py --step quality --current ${{ inputs.run-build && 3 || 2 }} --total ${{ inputs.run-build && 3 || 2 }} --detail "Finding dead code"
          python3 .ci-gates/scripts/swift-quality-gate.py \
            --config "${{ inputs.config }}" \
            --stage dead-code \
            --mode all 2>&1 | tee -a "$RUNNER_TEMP/ci-gate.log"

      - name: Explain failure
        if: ${{ failure() && inputs.explain-model != '' }}
        shell: bash
        run: |
          python3 .ci-gates/scripts/explain-failure.py \
            --log "$RUNNER_TEMP/ci-gate.log" \
            --gate "Swift Quality Gate" \
            --model "${{ inputs.explain-model }}" \
            --base "${{ steps.scan.outputs.base }}"
