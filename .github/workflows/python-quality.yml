name: Python Quality Gate

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON array of runner labels to target.
        type: string
        default: '["self-hosted", "macOS", "ARM64", "ci-scope"]'
      runner-group:
        description: Runner group for the routing contract.
        type: string
        default: ci-scope
      runner-labels:
        description: JSON array of runner labels to target.
        type: string
        default: '["self-hosted", "macOS", "ARM64", "ci-scope"]'
      runner-label:
        description: Single runner label used by the GitHub group-and-label scheduler.
        type: string
        default: ci-scope
      routing-generation:
        description: Routing generation; v1 remains the production default.
        type: string
        default: v1
      workflow-contract-version:
        description: Workflow contract version; v1 remains the production default.
        type: string
        default: v1
      trust-fixture-mode:
        description: Canary-only trust fixture mode; empty/off in production.
        type: string
        default: ''
      working-directory:
        description: Directory containing the Python sources.
        type: string
        default: "."
      gates-ref:
        description: ci-gates ref to fetch scripts from.
        type: string
        default: main
      explain-model:
        description: Ollama model that explains failures; empty string disables.
        type: string
        default: qwen3-coder:30b-a3b-q4_K_M

jobs:
  routing-validation:
    uses: ./.github/workflows/routing-validation.yml
    with:
      runner-group: ${{ inputs['runner-group'] }}
      runner-labels: ${{ inputs['runner-labels'] }}
      routing-generation: ${{ inputs['routing-generation'] }}
      workflow-contract-version: ${{ inputs['workflow-contract-version'] }}
      trust-fixture-mode: ${{ inputs['trust-fixture-mode'] }}
      gates-ref: ${{ inputs['gates-ref'] }}

  python-quality-gate:
    name: Python Quality Gate
    needs: routing-validation
    if: ${{ needs.routing-validation.result == 'success' }}
    runs-on:
      group: ${{ inputs['runner-group'] }}
      labels: ${{ inputs['runner-label'] }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"

      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Fetch ci-gates
        shell: bash
        env:
          GATES_REF: ${{ inputs.gates-ref }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ci-gates"
          git clone --quiet --no-checkout --filter=blob:none \
            https://github.com/ForkHorizon/ci-gates "$RUNNER_TEMP/ci-gates"
          git -C "$RUNNER_TEMP/ci-gates" fetch --quiet --depth 1 origin -- "$GATES_REF"
          git -C "$RUNNER_TEMP/ci-gates" checkout --quiet --detach FETCH_HEAD

      - name: Ensure ruff
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current 1 --total 4 --detail "Preparing Ruff"
          command -v ruff >/dev/null || brew install ruff

      - name: Select ruff config
        id: ruff
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current 2 --total 4 --detail "Loading Ruff configuration"
          config=""
          if [ -f ruff.toml ] || [ -f .ruff.toml ]; then
            :
          elif [ -f pyproject.toml ] && grep -q "\[tool\.ruff" pyproject.toml; then
            :
          else
            config="$RUNNER_TEMP/ci-gates/configs/ruff-strict.toml"
          fi
          echo "config=$config" >> "$GITHUB_OUTPUT"

      - name: Ruff lint
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current 3 --total 4 --detail "Linting Python sources"
          config="${{ steps.ruff.outputs.config }}"
          if [ -n "$config" ]; then
            ruff check --config "$config" . 2>&1 | tee -a "$RUNNER_TEMP/ci-gate.log"
          else
            ruff check . 2>&1 | tee -a "$RUNNER_TEMP/ci-gate.log"
          fi

      - name: Ruff format check
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current 4 --total 4 --detail "Checking Python formatting"
          config="${{ steps.ruff.outputs.config }}"
          if [ -n "$config" ]; then
            ruff format --check --config "$config" . 2>&1 | tee -a "$RUNNER_TEMP/ci-gate.log"
          else
            ruff format --check . 2>&1 | tee -a "$RUNNER_TEMP/ci-gate.log"
          fi

      - name: Explain failure
        if: ${{ failure() && inputs.explain-model != '' }}
        run: |
          python3 "$RUNNER_TEMP/ci-gates/scripts/explain-failure.py" \
            --log "$RUNNER_TEMP/ci-gate.log" \
            --gate "Python Quality Gate" \
            --model "${{ inputs.explain-model }}" \
            --base "origin/${{ github.event.repository.default_branch }}"
