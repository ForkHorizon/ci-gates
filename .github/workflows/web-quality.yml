name: Web Quality Gate

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON array of runner labels to target.
        type: string
        default: '["self-hosted", "macOS", "ARM64", "ci-scope"]'
      runner-group:
        description: Runner group for the routing contract.
        type: string
        default: ci-scope
      runner-labels:
        description: JSON array of runner labels to target.
        type: string
        default: '["self-hosted", "macOS", "ARM64", "ci-scope"]'
      runner-label:
        description: Single runner label used by the GitHub group-and-label scheduler.
        type: string
        default: ci-scope
      routing-generation:
        description: Routing generation; v1 remains the production default.
        type: string
        default: v1
      workflow-contract-version:
        description: Workflow contract version; v1 remains the production default.
        type: string
        default: v1
      trust-fixture-mode:
        description: Canary-only trust fixture mode; empty/off in production.
        type: string
        default: ''
      working-directory:
        description: Directory containing package.json.
        type: string
        default: "."
      duplication-threshold:
        description: Max allowed duplicated-code percentage (jscpd).
        type: string
        default: "2"
      gates-ref:
        description: ci-gates ref to fetch scripts from.
        type: string
        default: main
      explain-model:
        description: Ollama model that explains failures; empty string disables.
        type: string
        default: qwen3-coder:30b-a3b-q4_K_M

jobs:
  routing-validation:
    uses: ./.github/workflows/routing-validation.yml
    with:
      runner-group: ${{ inputs['runner-group'] }}
      runner-labels: ${{ inputs['runner-labels'] }}
      routing-generation: ${{ inputs['routing-generation'] }}
      workflow-contract-version: ${{ inputs['workflow-contract-version'] }}
      trust-fixture-mode: ${{ inputs['trust-fixture-mode'] }}
      gates-ref: ${{ inputs['gates-ref'] }}

  web-quality-gate:
    name: Web Quality Gate
    needs: routing-validation
    if: ${{ needs.routing-validation.result == 'success' }}
    runs-on:
      group: ${{ inputs['runner-group'] }}
      labels: ${{ inputs['runner-label'] }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"

      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Fetch ci-gates
        shell: bash
        env:
          GATES_REF: ${{ inputs.gates-ref }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ci-gates"
          git clone --quiet --no-checkout --filter=blob:none \
            https://github.com/ForkHorizon/ci-gates "$RUNNER_TEMP/ci-gates"
          git -C "$RUNNER_TEMP/ci-gates" fetch --quiet --depth 1 origin -- "$GATES_REF"
          git -C "$RUNNER_TEMP/ci-gates" checkout --quiet --detach FETCH_HEAD

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current 1 --total 5 --detail "Installing dependencies"
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile 2>&1 | tee -a "$RUNNER_TEMP/ci-gate.log"
          elif [ -f package-lock.json ]; then
            npm ci 2>&1 | tee -a "$RUNNER_TEMP/ci-gate.log"
          else
            npm install 2>&1 | tee -a "$RUNNER_TEMP/ci-gate.log"
          fi

      - name: Typecheck
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current 2 --total 5 --detail "Type checking"
          if [ ! -f tsconfig.json ]; then
            echo "::notice::Typecheck skipped: no tsconfig.json."
            exit 0
          fi
          npx --no-install tsc --noEmit 2>&1 | tee -a "$RUNNER_TEMP/ci-gate.log"

      - name: Lint
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current 3 --total 5 --detail "Linting source"
          if ! ls eslint.config.* .eslintrc* >/dev/null 2>&1; then
            echo "::notice::ESLint skipped: no config in this repo. Add eslint.config.mjs to enable linting."
            exit 0
          fi
          npx --no-install eslint . --max-warnings 0 2>&1 | tee -a "$RUNNER_TEMP/ci-gate.log"

      - name: Dead code and unused dependencies
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current 4 --total 5 --detail "Finding unused code"
          npx -y knip 2>&1 | tee -a "$RUNNER_TEMP/ci-gate.log"

      - name: Copy-paste detection
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current 5 --total 5 --detail "Checking duplication"
          npx -y jscpd . \
            --threshold "${{ inputs.duplication-threshold }}" \
            --ignore "**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.min.js" \
            2>&1 | tee -a "$RUNNER_TEMP/ci-gate.log"

      - name: Explain failure
        if: ${{ failure() && inputs.explain-model != '' }}
        run: |
          python3 "$RUNNER_TEMP/ci-gates/scripts/explain-failure.py" \
            --log "$RUNNER_TEMP/ci-gate.log" \
            --gate "Web Quality Gate" \
            --model "${{ inputs.explain-model }}" \
            --base "origin/${{ github.event.repository.default_branch }}"
