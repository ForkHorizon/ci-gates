name: Go Quality Gate

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON array of runner labels to target.
        type: string
        default: '["self-hosted", "macOS", "ARM64", "ci-scope"]'
      runner-group:
        description: Runner group for the routing contract.
        type: string
        default: ci-scope
      runner-labels:
        description: JSON array of runner labels to target.
        type: string
        default: '["self-hosted", "macOS", "ARM64", "ci-scope"]'
      runner-label:
        description: Single runner label used by the GitHub group-and-label scheduler.
        type: string
        default: ci-scope
      routing-generation:
        description: Routing generation; v1 remains the production default.
        type: string
        default: v1
      workflow-contract-version:
        description: Workflow contract version; v1 remains the production default.
        type: string
        default: v1
      trust-fixture-mode:
        description: Canary-only trust fixture mode; empty/off in production.
        type: string
        default: ''
      working-directory:
        description: Directory containing the Go module.
        type: string
        default: "."
      bootstrap-command:
        description: Optional shell command to run before vet/lint, e.g. to satisfy a go:embed target on a fresh checkout.
        type: string
        default: ""
      gates-ref:
        description: ci-gates ref to fetch scripts from.
        type: string
        default: main
      explain-model:
        description: Ollama model that explains failures; empty string disables.
        type: string
        default: qwen3-coder:30b-a3b-q4_K_M

jobs:
  routing-validation:
    uses: ./.github/workflows/routing-validation.yml
    with:
      runner-group: ${{ inputs['runner-group'] }}
      runner-labels: ${{ inputs['runner-labels'] }}
      routing-generation: ${{ inputs['routing-generation'] }}
      workflow-contract-version: ${{ inputs['workflow-contract-version'] }}
      trust-fixture-mode: ${{ inputs['trust-fixture-mode'] }}
      gates-ref: ${{ inputs['gates-ref'] }}

  go-quality-gate:
    name: Go Quality Gate
    needs: routing-validation
    if: ${{ needs.routing-validation.result == 'success' }}
    runs-on:
      group: ${{ inputs['runner-group'] }}
      labels: ${{ inputs['runner-label'] }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"

      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Fetch ci-gates
        env:
          GATES_REF: ${{ inputs.gates-ref }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ci-gates"
          git clone --quiet --no-checkout --filter=blob:none \
            https://github.com/ForkHorizon/ci-gates "$RUNNER_TEMP/ci-gates"
          git -C "$RUNNER_TEMP/ci-gates" fetch --quiet --depth 1 origin -- "$GATES_REF"
          git -C "$RUNNER_TEMP/ci-gates" checkout --quiet --detach FETCH_HEAD

      - name: Download modules
        run: |
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current 1 --total ${{ inputs.bootstrap-command != '' && 6 || 5 }} --detail "Downloading modules"
          go mod download

      - name: Bootstrap
        if: ${{ inputs.bootstrap-command != '' }}
        run: |
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current 2 --total 6 --detail "Bootstrapping project"
          ${{ inputs.bootstrap-command }}

      - name: Ensure golangci-lint
        run: |
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current ${{ inputs.bootstrap-command != '' && 3 || 2 }} --total ${{ inputs.bootstrap-command != '' && 6 || 5 }} --detail "Preparing golangci-lint"
          command -v golangci-lint >/dev/null || brew install golangci-lint

      - name: go vet
        run: |
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current ${{ inputs.bootstrap-command != '' && 4 || 3 }} --total ${{ inputs.bootstrap-command != '' && 6 || 5 }} --detail "Running go vet"
          go vet ./... 2>&1 | tee -a "$RUNNER_TEMP/ci-gate.log"

      - name: gofmt check
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current ${{ inputs.bootstrap-command != '' && 5 || 4 }} --total ${{ inputs.bootstrap-command != '' && 6 || 5 }} --detail "Checking formatting"
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted" | tee -a "$RUNNER_TEMP/ci-gate.log"
            echo "Files not gofmt-formatted (run: gofmt -w .)" | tee -a "$RUNNER_TEMP/ci-gate.log"
            exit 1
          fi

      - name: golangci-lint
        run: |
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current ${{ inputs.bootstrap-command != '' && 6 || 5 }} --total ${{ inputs.bootstrap-command != '' && 6 || 5 }} --detail "Running golangci-lint"
          golangci-lint run ./... 2>&1 | tee -a "$RUNNER_TEMP/ci-gate.log"

      - name: Explain failure
        if: ${{ failure() && inputs.explain-model != '' }}
        run: |
          python3 "$RUNNER_TEMP/ci-gates/scripts/explain-failure.py" \
            --log "$RUNNER_TEMP/ci-gate.log" \
            --gate "Go Quality Gate" \
            --model "${{ inputs.explain-model }}" \
            --base "origin/${{ github.event.repository.default_branch }}"
