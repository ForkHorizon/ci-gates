name: Go Quality Gate

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON array of runner labels to target.
        type: string
        default: '["self-hosted", "macOS", "ARM64", "ci-scope"]'
      working-directory:
        description: Directory containing the Go module.
        type: string
        default: "."
      bootstrap-command:
        description: Optional shell command to run before vet/lint, e.g. to satisfy a go:embed target on a fresh checkout.
        type: string
        default: ""
      gates-ref:
        description: ci-gates ref to fetch scripts from.
        type: string
        default: main
      explain-model:
        description: Ollama model that explains failures; empty string disables.
        type: string
        default: qwen3-coder:30b-a3b-q4_K_M

jobs:
  go-quality-gate:
    name: Go Quality Gate
    runs-on: ${{ fromJSON(inputs['runs-on']) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.15"

      - name: Checkout project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch ci-gates
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ci-gates"
          git clone --quiet --depth 1 --branch "${{ inputs.gates-ref }}" \
            https://github.com/ForkHorizon/ci-gates "$RUNNER_TEMP/ci-gates"

      - name: Download modules
        run: |
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current 1 --total ${{ inputs.bootstrap-command != '' && 6 || 5 }} --detail "Downloading modules"
          go mod download

      - name: Bootstrap
        if: ${{ inputs.bootstrap-command != '' }}
        run: |
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current 2 --total 6 --detail "Bootstrapping project"
          ${{ inputs.bootstrap-command }}

      - name: Ensure golangci-lint
        run: |
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current ${{ inputs.bootstrap-command != '' && 3 || 2 }} --total ${{ inputs.bootstrap-command != '' && 6 || 5 }} --detail "Preparing golangci-lint"
          command -v golangci-lint >/dev/null || brew install golangci-lint

      - name: go vet
        run: |
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current ${{ inputs.bootstrap-command != '' && 4 || 3 }} --total ${{ inputs.bootstrap-command != '' && 6 || 5 }} --detail "Running go vet"
          go vet ./... 2>&1 | tee -a "$RUNNER_TEMP/ci-gate.log"

      - name: gofmt check
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current ${{ inputs.bootstrap-command != '' && 5 || 4 }} --total ${{ inputs.bootstrap-command != '' && 6 || 5 }} --detail "Checking formatting"
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted" | tee -a "$RUNNER_TEMP/ci-gate.log"
            echo "Files not gofmt-formatted (run: gofmt -w .)" | tee -a "$RUNNER_TEMP/ci-gate.log"
            exit 1
          fi

      - name: golangci-lint
        run: |
          python3 "$RUNNER_TEMP/ci-gates/scripts/_progress.py" --step quality --current ${{ inputs.bootstrap-command != '' && 6 || 5 }} --total ${{ inputs.bootstrap-command != '' && 6 || 5 }} --detail "Running golangci-lint"
          golangci-lint run ./... 2>&1 | tee -a "$RUNNER_TEMP/ci-gate.log"

      - name: Explain failure
        if: ${{ failure() && inputs.explain-model != '' }}
        run: |
          python3 "$RUNNER_TEMP/ci-gates/scripts/explain-failure.py" \
            --log "$RUNNER_TEMP/ci-gate.log" \
            --gate "Go Quality Gate" \
            --model "${{ inputs.explain-model }}" \
            --base "origin/${{ github.event.repository.default_branch }}"
