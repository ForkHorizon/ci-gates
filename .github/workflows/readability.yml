# DEPRECATED — renamed to code-linter.yml. Kept as a forwarder so callers that
# still point at readability.yml keep working while they migrate; the defaults
# below must stay identical to code-linter.yml's. Delete once no repo in the
# org references this file.
name: Code Linter (deprecated alias)

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON array of runner labels to target.
        type: string
        default: '["self-hosted", "macOS", "ARM64", "ci-scope"]'
      mode:
        description: "Files to scan: auto (derive from event), all, or changed."
        type: string
        default: auto
      config:
        description: Path to the Code Linter config in the calling repo.
        type: string
        default: .linter-checker-300-lines.json
      gates-ref:
        description: ci-gates ref to fetch scripts from.
        type: string
        default: main
      explain-model:
        description: Ollama model that explains failures; empty string disables.
        type: string
        default: qwen3-coder:30b-a3b-q4_K_M

jobs:
  code-linter:
    uses: ForkHorizon/ci-gates/.github/workflows/code-linter.yml@main
    with:
      runs-on: ${{ inputs['runs-on'] }}
      mode: ${{ inputs.mode }}
      config: ${{ inputs.config }}
      gates-ref: ${{ inputs['gates-ref'] }}
      explain-model: ${{ inputs['explain-model'] }}
